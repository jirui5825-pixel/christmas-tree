<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03060d">
<title>Merry Christmas · 手势圣诞树</title>
<meta name="description" content="一棵会呼吸的 3D 粒子圣诞树：挥手转树、捏合缩放、握拳炸成星云。Three.js + MediaPipe。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<style>
  :root{
    --gold:#ffd9a0;
    --gold-2:#ffe9c9;
    --ink:#eaf2ff;
    --glass:rgba(255,255,255,.07);
    --glass-brd:rgba(255,255,255,.16);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","Noto Serif SC",serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; background:#03060d; color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(120% 90% at 50% 108%, rgba(38,86,130,.52) 0%, rgba(14,32,56,.32) 38%, rgba(0,0,0,0) 68%),
      radial-gradient(70% 55% at 50% 16%, rgba(30,52,96,.40) 0%, rgba(0,0,0,0) 70%),
      linear-gradient(180deg,#04070f 0%, #050b16 42%, #02040a 100%);
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:3; pointer-events:none;
    background:radial-gradient(58% 52% at 50% 52%, rgba(0,0,0,0) 42%, rgba(0,0,0,.5) 100%);
  }
  #stage{position:fixed; inset:0; z-index:2}
  #stage canvas{display:block; width:100%; height:100%; opacity:0; transition:opacity 1.1s ease .15s}
  #fx{position:fixed; inset:0; z-index:2; pointer-events:none}
  body.ready #stage canvas{opacity:1}

  .hud{position:fixed; z-index:5; pointer-events:none; opacity:0; transform:translateY(10px);
       transition:opacity .9s ease, transform .9s ease}
  body.ready .hud{opacity:1; transform:none}
  .top{left:0; right:0; top:clamp(18px,4.6vh,52px); text-align:center; padding:0 20px}
  .title{
    margin:0; font-family:var(--serif); font-weight:500;
    font-size:clamp(21px,6vw,54px); letter-spacing:.1em; text-transform:uppercase;
    background:linear-gradient(180deg,#fffdf8 0%,var(--gold-2) 38%,#f0b96b 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,196,110,.35));
  }
  .sub{
    margin:.55em 0 0; font-size:clamp(12px,1.5vw,15px); letter-spacing:.22em;
    color:rgba(226,238,255,.62); font-weight:300;
  }
  .bottom{left:0; right:0; bottom:max(26px,env(safe-area-inset-bottom)); text-align:center; padding:0 16px}
  .hint{font-size:12px; letter-spacing:.14em; color:rgba(210,226,248,.42)}

  .corner{position:fixed; z-index:5; font-size:11px; letter-spacing:.18em; color:rgba(200,218,244,.34);
          pointer-events:none; opacity:0; transition:opacity 1.2s ease .4s}
  body.ready .corner{opacity:1}
  .corner.bl{left:18px; bottom:14px}
  .corner.br{right:18px; bottom:14px}

  /* 按钮 */
  .dock{
    position:fixed; z-index:6; left:0; right:0; bottom:calc(max(26px,env(safe-area-inset-bottom)) + 34px);
    transform:translateY(14px); display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    opacity:0; transition:opacity .8s ease .25s, transform .8s ease .25s; padding:0 12px;
  }
  body.ready .dock{opacity:1; transform:none}
  .btn{
    pointer-events:auto; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    padding:9px 15px; border-radius:999px; border:1px solid var(--glass-brd);
    background:var(--glass); color:rgba(235,244,255,.86); font-size:13px; letter-spacing:.06em;
    backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
    transition:background .25s, border-color .25s, transform .18s, color .25s;
    font-family:inherit;
  }
  .btn:hover{background:rgba(255,255,255,.14); border-color:rgba(255,214,158,.45); color:#fff}
  .btn:active{transform:scale(.96)}
  .btn.on{border-color:rgba(255,206,140,.7); color:#ffdfb0; background:rgba(255,190,110,.14)}
  .btn[disabled]{opacity:.55; cursor:default}
  .btn svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.6;
           stroke-linecap:round; stroke-linejoin:round; opacity:.9}

  /* 摄像头预览 */
  .hand{
    position:fixed; z-index:6; left:16px; bottom:calc(max(26px,env(safe-area-inset-bottom)) + 34px);
    width:176px; padding:8px 8px 6px; border-radius:16px;
    background:rgba(10,16,26,.55); border:1px solid var(--glass-brd);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    display:none; box-shadow:0 10px 30px rgba(0,0,0,.45);
  }
  .hand.show{display:block; animation:pop .5s ease both}
  @keyframes pop{from{opacity:0; transform:translateY(10px) scale(.96)} to{opacity:1; transform:none}}
  .hand canvas{width:100%; height:auto; display:block; border-radius:10px; background:#05080f}
  .hand .row{display:flex; align-items:center; justify-content:space-between; padding-top:6px;
             font-size:11px; letter-spacing:.08em; color:rgba(214,230,250,.6)}
  .hand .g{color:var(--gold); font-weight:500}
  .hand .dot{width:6px; height:6px; border-radius:50%; background:#54e08a; box-shadow:0 0 8px #54e08a}
  .hand .dot.wait{background:#f2b34b; box-shadow:0 0 8px #f2b34b}

  .toast{
    position:fixed; z-index:9; left:50%; bottom:calc(max(26px,env(safe-area-inset-bottom)) + 92px);
    transform:translate(-50%,8px); padding:10px 18px; border-radius:999px;
    background:rgba(8,14,24,.82); border:1px solid var(--glass-brd); color:var(--gold-2);
    font-size:13px; letter-spacing:.08em; opacity:0; pointer-events:none;
    transition:opacity .3s, transform .3s; backdrop-filter:blur(10px);
    max-width:min(86vw,520px); text-align:center; line-height:1.6;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}
  #fatal{
    position:fixed; inset:0; z-index:20; display:none; place-items:center; text-align:center;
    background:#03060d; color:#cfe0f5; padding:30px; line-height:1.9; font-size:14px;
  }
  #fatal.show{display:grid}
  #fatal code{color:var(--gold); font-size:12px}

  @media (max-width:560px){
    .dock{gap:6px; bottom:calc(max(14px,env(safe-area-inset-bottom)) + 72px); padding:0 8px}
    .btn{padding:9px 11px; font-size:12px}
    .btn .lbl{display:none}
    .bottom{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 30px)}
    .hint{font-size:11px; letter-spacing:.1em}
    .corner{display:none}
    .hand{width:124px; left:10px; bottom:calc(max(14px,env(safe-area-inset-bottom)) + 124px)}
  }
  @media (prefers-reduced-motion:reduce){
    #stage canvas{transition:none}
  }
</style>
</head>
<body>

<div id="stage" aria-hidden="true"></div>
<canvas id="fx"></canvas>

<div class="hud top">
  <h1 class="title" id="title">Merry Christmas</h1>
  <p class="sub" id="sub">愿这棵树替我陪你过冬</p>
</div>

<div class="hand" id="handPanel">
  <canvas id="handCanvas" width="336" height="252"></canvas>
  <div class="row">
    <span><span class="dot" id="handDot"></span> <span id="handState">初始化…</span></span>
    <span class="g" id="handGesture">—</span>
  </div>
</div>

<div class="dock">
  <button class="btn" id="btnHand" type="button" title="开启摄像头，用手控制这棵树">
    <svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11.5V4.8a1.5 1.5 0 0 1 3 0V12"/><path d="M14 11.8V6.5a1.5 1.5 0 0 1 3 0V14"/><path d="M17 12.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.6a6 6 0 0 1-4.6-2.2L5 15.2a1.6 1.6 0 0 1 2.4-2.1L9 15"/></svg>
    <span class="lbl">手势</span>
  </button>
  <button class="btn" id="btnMusic" type="button" title="播放 / 暂停铃儿响叮当">
    <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.6"/><circle cx="16.5" cy="16" r="2.6"/></svg>
    <span class="lbl">音乐</span>
  </button>
  <button class="btn" id="btnPhotos" type="button" title="把你的照片挂到树上">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l4.5-4.2L13 17l3-2.6 4 3.6"/></svg>
    <span class="lbl">挂照片</span>
  </button>
  <button class="btn" id="btnName" type="button" title="把名字写进副标题">
    <svg viewBox="0 0 24 24"><path d="M4 20h4l10-10a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5 4 20z"/></svg>
    <span class="lbl">名字</span>
  </button>
  <button class="btn" id="btnShare" type="button" title="复制带名字的链接">
    <svg viewBox="0 0 24 24"><path d="M10 13a4.5 4.5 0 0 0 6.4 0l2.6-2.6a4.5 4.5 0 0 0-6.4-6.4L11 5.6"/><path d="M14 11a4.5 4.5 0 0 0-6.4 0L5 13.6a4.5 4.5 0 0 0 6.4 6.4l1.6-1.6"/></svg>
    <span class="lbl">复制链接</span>
  </button>
  <button class="btn" id="btnFull" type="button" title="全屏">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <span class="lbl">全屏</span>
  </button>
</div>

<div class="hud bottom">
  <p class="hint" id="hint">拖动旋转 · 滚轮缩放 · 点击撒星火</p>
</div>

<div class="corner bl">christmas-tree · v7.6 gesture</div>
<div class="corner br">three.js · mediapipe · webgl</div>

<div class="toast" id="toast"></div>
<input type="file" id="filePicker" accept="image/*" multiple hidden>
<video id="cam" playsinline muted style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;top:-10px"></video>

<div id="fatal">
  <div>
    <p style="font-size:20px;letter-spacing:.2em;color:#ffd9a0;margin:0 0 12px">3D 场景没能启动</p>
    <p id="fatalMsg">需要浏览器支持 WebGL。<br>试试用 Chrome / Edge 打开，或开启硬件加速。</p>
    <p><code>chrome://settings/system</code> → 使用图形加速功能</p>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var TAU = Math.PI * 2;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
                 (navigator.maxTouchPoints > 1 && window.innerWidth < 820);

  function fail(msg) { $('fatalMsg').innerHTML = msg; $('fatal').classList.add('show'); }
  if (typeof THREE === 'undefined') {
    fail('没有找到 <code>vendor/three.min.js</code>。<br>请把整个文件夹一起上传，不要只传 index.html。');
    return;
  }

  var toastTimer = null;
  function toast(text, ms) {
    var el = $('toast');
    el.innerHTML = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, ms || 2400);
  }

  /* =====================================================================
     参数
     ===================================================================== */
  var H = 15, R = 6.2, TURNS = 9;
  var TARGET_Y = H * 0.57;
  var fit = { fov: 45, dist: 39, ty: H * 0.48 };

  var N_SHELL   = isMobile ? 10000 : 20000;
  var N_GARLAND = isMobile ? 2600  : 5200;
  var N_ORN     = isMobile ? 200   : 360;
  var N_FLOOR   = isMobile ? 800   : 1500;
  var N_SNOW    = isMobile ? 900   : 1800;

  function coneRadius(y) {
    var t = Math.min(Math.max(y / H, 0), 1);
    return R * Math.pow(1 - t, 0.86);
  }
  function rand(a, b) { return a + Math.random() * (b - a); }

  /* =====================================================================
     渲染器 / 场景 / 后期
     ===================================================================== */
  var stage = $('stage');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: 'high-performance' });
  } catch (e) {
    fail('这个浏览器没能创建 WebGL 上下文。<br>请用较新的 Chrome / Edge / Safari 打开。');
    return;
  }
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(DPR);
  renderer.setSize(window.innerWidth, window.innerHeight);
  if ('outputEncoding' in renderer) renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0x000000, 0);
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 400);

  // ---- 全屏四边形（后期用）----
  var fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  var fsScene = new THREE.Scene();
  var fsQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
  fsQuad.frustumCulled = false;
  fsScene.add(fsQuad);

  var rtOpts = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat };
  var rtScene = new THREE.WebGLRenderTarget(2, 2, rtOpts);
  rtScene.texture.encoding = THREE.sRGBEncoding;
  var rtBright = new THREE.WebGLRenderTarget(2, 2, rtOpts);
  var rtBlurA = new THREE.WebGLRenderTarget(2, 2, rtOpts);
  var rtBlurB = new THREE.WebGLRenderTarget(2, 2, rtOpts);

  var VS_QUAD = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';

  var matBright = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null }, uThreshold: { value: 0.56 }, uKnee: { value: 0.28 } },
    vertexShader: VS_QUAD,
    fragmentShader: [
      'uniform sampler2D tDiffuse; uniform float uThreshold; uniform float uKnee;',
      'varying vec2 vUv;',
      'void main(){',
      '  vec3 c = texture2D(tDiffuse, vUv).rgb;',
      '  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));',
      '  float w = smoothstep(uThreshold, uThreshold + uKnee, l);',
      '  gl_FragColor = vec4(c * w, 1.0);',
      '}'
    ].join('\n'),
    depthTest: false, depthWrite: false
  });

  var matBlur = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2(1, 0) } },
    vertexShader: VS_QUAD,
    fragmentShader: [
      'uniform sampler2D tDiffuse; uniform vec2 uDir;',
      'varying vec2 vUv;',
      'void main(){',
      '  vec3 s = texture2D(tDiffuse, vUv).rgb * 0.227027;',
      '  s += (texture2D(tDiffuse, vUv + uDir * 1.3846).rgb + texture2D(tDiffuse, vUv - uDir * 1.3846).rgb) * 0.316216;',
      '  s += (texture2D(tDiffuse, vUv + uDir * 3.2308).rgb + texture2D(tDiffuse, vUv - uDir * 3.2308).rgb) * 0.070270;',
      '  gl_FragColor = vec4(s, 1.0);',
      '}'
    ].join('\n'),
    depthTest: false, depthWrite: false
  });

  var matComp = new THREE.ShaderMaterial({
    uniforms: {
      tScene: { value: null }, tBloom: { value: null },
      uStrength: { value: 0.62 }, uVignette: { value: 0.30 }
    },
    vertexShader: VS_QUAD,
    fragmentShader: [
      'uniform sampler2D tScene; uniform sampler2D tBloom;',
      'uniform float uStrength; uniform float uVignette;',
      'varying vec2 vUv;',
      'void main(){',
      '  vec3 base = texture2D(tScene, vUv).rgb;',
      '  vec3 bloom = texture2D(tBloom, vUv).rgb;',
      '  vec3 col = base + bloom * uStrength;',
      '  float l = dot(col, vec3(0.299, 0.587, 0.114));',
      '  col = mix(vec3(l), col, 1.16);',
      '  col = pow(max(col, 0.0), vec3(0.96));',
      '  float d = distance(vUv, vec2(0.5));',
      '  col *= 1.0 - smoothstep(0.42, 0.98, d) * uVignette * 0.35;',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n'),
    depthTest: false, depthWrite: false
  });

  var BLOOM_SCALE = 0.5;
  function resizeTargets(w, h) {
    rtScene.setSize(w, h);
    var bw = Math.max(2, Math.floor(w * BLOOM_SCALE)), bh = Math.max(2, Math.floor(h * BLOOM_SCALE));
    rtBright.setSize(bw, bh); rtBlurA.setSize(bw, bh); rtBlurB.setSize(bw, bh);
    matBlur.uniforms.uDir.value.set(1 / bw, 0);
  }

  /* =====================================================================
     点材质
     ===================================================================== */
  var POINT_VERT = [
    'uniform float uTime; uniform float uPR; uniform float uScale; uniform float uSway;',
    'uniform float uTwinkle; uniform float uAlpha; uniform float uExplode;',
    'attribute float aSize; attribute float aPhase; attribute float aAlpha;',
    'attribute vec3 aColor; attribute vec3 aDir;',
    'varying vec3 vColor; varying float vA;',
    'void main() {',
    '  vec3 p = position;',
    '  float h = max(p.y, 0.0) / ' + H.toFixed(1) + ';',
    '  float s = sin(uTime * 0.75 + h * 3.0 + aPhase * 6.2831);',
    '  p.x += s * uSway * (0.25 + h * 1.1);',
    '  p.z += cos(uTime * 0.62 + h * 2.4 + aPhase * 6.2831) * uSway * (0.25 + h * 1.1);',
    '  // 握拳炸开：沿随机方向推出去，并带一点上浮',
    '  float ex = uExplode * uExplode;',
    '  p += aDir * (ex * (5.0 + 7.0 * aPhase));',
    '  p.y += ex * (aPhase - 0.35) * 3.4;',
    '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
    '  gl_Position = projectionMatrix * mv;',
    '  float tw = mix(1.0, 0.5 + 0.5 * sin(uTime * 2.6 + aPhase * 21.0), uTwinkle);',
    '  float ps = aSize * uScale * uPR * (66.0 / max(-mv.z, 0.001)) * (0.8 + 0.4 * tw);',
    '  gl_PointSize = clamp(ps, 1.0, 26.0);',
    '  vColor = aColor;',
    '  vA = uAlpha * (0.40 + 0.32 * tw) * aAlpha * (1.0 - ex * 0.25);',
    '}'
  ].join('\n');

  var POINT_FRAG = [
    'varying vec3 vColor; varying float vA; uniform float uSoft;',
    'void main() {',
    '  vec2 uv = gl_PointCoord - 0.5;',
    '  float d = length(uv) * 2.0;',
    '  if (d > 1.0) discard;',
    '  float a = smoothstep(1.0, 0.0, d);',
    '  a = pow(a, uSoft);',
    '  gl_FragColor = vec4(vColor * (0.55 + 0.75 * a), a * vA);',
    '}'
  ].join('\n');

  function makeMaterial(opts) {
    return new THREE.ShaderMaterial({
      uniforms: {
        uTime:    { value: 0 },
        uPR:      { value: DPR },
        uScale:   { value: opts.scale || 1 },
        uSway:    { value: opts.sway || 0 },
        uTwinkle: { value: opts.twinkle != null ? opts.twinkle : 0.6 },
        uAlpha:   { value: opts.alpha != null ? opts.alpha : 1 },
        uSoft:    { value: opts.soft != null ? opts.soft : 2.2 },
        uExplode: { value: 0 }
      },
      vertexShader: POINT_VERT,
      fragmentShader: POINT_FRAG,
      transparent: true, depthWrite: false, depthTest: true,
      blending: THREE.AdditiveBlending
    });
  }

  var explodeMats = [];
  function buildPoints(count, fill, material) {
    var pos = new Float32Array(count * 3);
    var col = new Float32Array(count * 3);
    var dir = new Float32Array(count * 3);
    var size = new Float32Array(count);
    var phase = new Float32Array(count);
    var alpha = new Float32Array(count);
    var c = new THREE.Color();
    for (var i = 0; i < count; i++) {
      var o = i * 3;
      fill(i, pos, o, c, size, i, phase, alpha);
      col[o] = c.r; col[o + 1] = c.g; col[o + 2] = c.b;
      // 炸开方向：以原点为心的球面 + 一点随机
      var dx = pos[o], dy = pos[o + 1] - H * 0.35, dz = pos[o + 2];
      var len = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
      dir[o]     = dx / len + rand(-0.25, 0.25);
      dir[o + 1] = dy / len * 0.7 + rand(-0.2, 0.35);
      dir[o + 2] = dz / len + rand(-0.25, 0.25);
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
    g.setAttribute('aDir', new THREE.BufferAttribute(dir, 3));
    g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    g.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
    g.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1));
    var p = new THREE.Points(g, material);
    p.frustumCulled = false;
    return p;
  }

  /* =====================================================================
     树 / 雪 / 地面
     ===================================================================== */
  var matTree = makeMaterial({ scale: 1.0, sway: 0.22, twinkle: 0.55, soft: 2.0, alpha: 0.95 });

    for (var i = 0; i < count; i++) {
      var a = Math.random() * TAU;
      var speed = (1.6 + Math.random() * 5.4) * s;
      fxParts.push({

        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed - 1.2 * s,
        life: 1,
        decay: 0.010 + Math.random() * 0.016,
        hue: hue + rand(-14, 14),
        size: (0.45 + Math.random() * 1.1) * s

    }
    if (fxParts.length > 2600) fxParts.splice(0, fxParts.length - 2600);

      p.life -= p.decay;

      p.vy += 2.4 * dt * (fxH / 900);
      p.vx *= (1 - 0.9 * dt);
      p.vy *= (1 - 0.5 * dt);

    var tips = [8, 12, 16, 20], pips = [6, 10, 14, 18];

    var pinch = dist3(lm[4], lm[8]) / size;
    var thumbOut = dist3(lm[4], lm[17]) > dist3(lm[3], lm[17]) * 1.05;

    var name = 'none';
    if (pinch < 0.42) name = 'pinch';
    else if (ext === 0) name = 'fist';
    else if (ext >= 4) name = 'open';
    else if (ext === 2 && dist3(lm[8], wrist) > dist3(lm[12], wrist) * 0.92) name = 'victory';
    else if (ext === 1) name = 'point';

      x: 1 - (lm[9].x * 0.5 + lm[0].x * 0.5),

      hands.pinchNow = info.pinch;
      hands.hasHand = true;
      var names = { open: '张掌', pinch: '捏合', fist: '握拳', victory: '✌', point: '指', none: '—' };
      $('handGesture').textContent = names[info.name] || '—';
      $('handState').textContent = '识别中';
    } else {
      hands.hasHand = false;
      hands.label = 'none';
      $('handGesture').textContent = '—';
      $('handState').textContent = '把手放进来';
    }
  }

  /* =====================================================================
     照片
     ===================================================================== */
  var photos = [];
  var filePicker = $('filePicker');

  function polaroid(img) {
    var W = 420, Hc = 500;
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = Hc;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#fbf8f3';
    ctx.beginPath();
    var r = 14;
    ctx.moveTo(r, 0); ctx.arcTo(W, 0, W, Hc, r); ctx.arcTo(W, Hc, 0, Hc, r);
    ctx.arcTo(0, Hc, 0, 0, r); ctx.arcTo(0, 0, W, 0, r); ctx.closePath();
    ctx.fill();
    var pad = 22, top = 22, bottom = 78;
    var iw = W - pad * 2, ih = Hc - top - bottom;
    var s = Math.max(iw / img.width, ih / img.height);
    var dw = img.width * s, dh = img.height * s;
    ctx.save();
    ctx.beginPath(); ctx.rect(pad, top, iw, ih); ctx.clip();
    ctx.drawImage(img, pad + (iw - dw) / 2, top + (ih - dh) / 2, dw, dh);
    ctx.restore();
    ctx.fillStyle = 'rgba(60,70,86,.55)';
    ctx.font = '300 22px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Merry Christmas', W / 2, Hc - 32);
    var tex = new THREE.CanvasTexture(cv);
    if ('encoding' in tex) tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    return tex;
  }

  function addPhoto(img) {
    var tex = polaroid(img);
    var mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0 });
    var sp = new THREE.Sprite(mat);
    var y = rand(1.6, H * 0.9);
    var a = rand(0, TAU);
    var rr = coneRadius(y) * 1.06 + 0.55;
    sp.position.set(Math.cos(a) * rr, y, Math.sin(a) * rr);
    var sc = 1.5 + (y / H) * 0.5;
    sp.scale.set(sc, sc * (500 / 420), 1);
    sp.material.rotation = rand(-0.14, 0.14);
    treeGroup.add(sp);
    photos.push(sp);
  }

  filePicker.addEventListener('change', function () {
    var files = Array.prototype.slice.call(filePicker.files || []);
    if (!files.length) return;
    files = files.slice(0, Math.max(14 - photos.length, 0));
    if (!files.length) { toast('树上最多挂 14 张，先刷新再来'); return; }
    var done = 0;
    files.forEach(function (f) {
      var url = URL.createObjectURL(f);
      var img = new Image();
      img.onload = function () {
        addPhoto(img);
        URL.revokeObjectURL(url);
        if (++done === files.length) toast('挂上去了 · 转一圈看看');
      };
      img.onerror = function () { URL.revokeObjectURL(url); toast('这张图片读不出来'); };
      img.src = url;
    });
    filePicker.value = '';
  });

  $('btnPhotos').addEventListener('click', function () { filePicker.click(); });

  /* =====================================================================
     音乐
     ===================================================================== */
  var actx = null, master = null, musicOn = false, musicTimer = null, nextLoopAt = 0;
  var BEAT = 0.34;
  var E4 = 329.63, F4 = 349.23, G4 = 392.00, C4 = 261.63, D4 = 293.66;
  var MELODY = [
    [E4, 1], [E4, 1], [E4, 2], [E4, 1], [E4, 1], [E4, 2],
    [E4, 1], [G4, 1], [C4, 1.5], [D4, 0.5], [E4, 4],
    [F4, 1], [F4, 1], [F4, 1.5], [F4, 0.5],
    [F4, 1], [E4, 1], [E4, 1], [E4, 0.5], [E4, 0.5],
    [E4, 1], [D4, 1], [D4, 1], [E4, 1], [D4, 2], [G4, 2],
    [E4, 1], [E4, 1], [E4, 2], [E4, 1], [E4, 1], [E4, 2],
    [E4, 1], [G4, 1], [C4, 1.5], [D4, 0.5], [E4, 4],
    [F4, 1], [F4, 1], [F4, 1.5], [F4, 0.5],
    [F4, 1], [E4, 1], [E4, 1], [E4, 0.5], [E4, 0.5],
    [G4, 1], [G4, 1], [F4, 1], [D4, 1], [C4, 4]
  ];

  function ensureAudio() {
    if (actx) return actx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0;
    var delay = actx.createDelay();
    delay.delayTime.value = 0.19;
    var fb = actx.createGain(); fb.gain.value = 0.26;
    var wet = actx.createGain(); wet.gain.value = 0.3;
    master.connect(actx.destination);
    master.connect(delay);
    delay.connect(fb); fb.connect(delay);
    delay.connect(wet); wet.connect(actx.destination);
    return actx;
  }

  function bell(t, freq, dur) {
    var g = actx.createGain();
    g.connect(master);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.20, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, 0.32) * 1.5);
    [[1, 1], [2.01, 0.34], [3.02, 0.12], [4.98, 0.05]].forEach(function (p) {
      var o = actx.createOscillator(), og = actx.createGain();
      o.type = 'sine'; o.frequency.value = freq * p[0]; og.gain.value = p[1];
      o.connect(og); og.connect(g);
      o.start(t); o.stop(t + Math.max(dur, 0.32) * 1.6 + 0.05);
    });
  }

  function scheduleLoop(startAt) {
    var t = startAt;
    for (var i = 0; i < MELODY.length; i++) { bell(t, MELODY[i][0], MELODY[i][1] * BEAT * 0.9); t += MELODY[i][1] * BEAT; }
    return t + 0.6;
  }
  function pump() {
    if (!musicOn) return;
    var now = actx.currentTime;
    while (nextLoopAt < now + 1.2) nextLoopAt = scheduleLoop(nextLoopAt);
    musicTimer = setTimeout(pump, 400);
  }
  function musicToggle() {
    var btn = $('btnMusic');
    if (!ensureAudio()) { toast('这个浏览器不支持 Web Audio'); return; }
    if (actx.state === 'suspended') actx.resume();
    musicOn = !musicOn;
    if (musicOn) {
      nextLoopAt = actx.currentTime + 0.15;
      master.gain.cancelScheduledValues(actx.currentTime);
      master.gain.setTargetAtTime(0.55, actx.currentTime, 0.4);
      pump();
      btn.classList.add('on');
      btn.querySelector('.lbl').textContent = '静音';
    } else {
      master.gain.setTargetAtTime(0, actx.currentTime, 0.25);
      clearTimeout(musicTimer);
      btn.classList.remove('on');
      btn.querySelector('.lbl').textContent = '音乐';
    }
  }
  $('btnMusic').addEventListener('click', musicToggle);

  /* =====================================================================
     文案 / 名字 / 分享
     ===================================================================== */
  var qs = new URLSearchParams(location.search);
  var name = (qs.get('to') || qs.get('name') || '').trim().slice(0, 20);

  function renderName() {
    if (name) {
      $('sub').textContent = '亲爱的 ' + name + '，愿这棵树替我陪你过冬';
      document.title = name + ' · Merry Christmas';
    } else {
      $('sub').textContent = '愿这棵树替我陪你过冬';
      document.title = 'Merry Christmas · 手势圣诞树';
    }
  }
  renderName();

  $('btnName').addEventListener('click', function () {
    var v = window.prompt('想在树上写给谁？（留空就取消）', name || '');
    if (v === null) return;
    name = v.trim().slice(0, 20);
    renderName();
    toast(name ? '写给 ' + name + ' 的树' : '已清空名字');
  });

  $('btnShare').addEventListener('click', function () {
    var url = location.origin + location.pathname + (name ? '?to=' + encodeURIComponent(name) : '');
    if (location.protocol === 'file:') { toast('本地文件模式：先部署到网上才有链接'); return; }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('链接已复制'); }
      catch (e) { toast('复制失败，手动复制地址栏吧'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { toast('链接已复制'); }, fallback);
    } else fallback();
  });

  $('btnFull').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  });

  $('btnHand').addEventListener('click', enableHands);

  /* =====================================================================
     手势 → 场景
     ===================================================================== */
  var handState = { gesture: 'none', active: false, holdT: 0, lastGesture: 'none' };
  var explode = 0, explodeTarget = 0;
  var bloomPulse = 0;
  var gestureRot = 0;

  function applyHand(dt) {
    var g = handState.gesture;
    var s = hands.smooth;

    // 平滑手掌位置
    s.x += (hands.palm.x - s.x) * Math.min(1, dt * 8);
    s.y += (hands.palm.y - s.y) * Math.min(1, dt * 8);

    var active = hands.ready && hands.hasHand && g !== 'none';

    if (active && (g === 'open' || g === 'point' || g === 'victory')) {
      // 手掌左右 → 树转动；上下 → 抬降机位
      theta += ((s.x - 0.5) * 2.6 - theta + gestureRot) * Math.min(1, dt * 3);
      phi += (0.13 + (0.5 - s.y) * 0.55 - phi) * Math.min(1, dt * 3);
      guestureActive = true;
    }

    if (active && g === 'pinch') {
      // 捏合程度 → 远近
      var k = Math.min(1, Math.max(0, (hands.pinchNow - 0.15) / 0.9));
      targetDist += ((16 + k * 34) - targetDist) * Math.min(1, dt * 4);
      userZoomed = true;
    }

    // 握拳 → 炸开
    explodeTarget = (active && g === 'fist') ? 1 : 0;
    explode += (explodeTarget - explode) * Math.min(1, dt * 3.4);

    // 手势切换钩子
    if (g !== handState.lastGesture) {
      if (handState.lastGesture === 'fist' && g !== 'fist') {
        // 松拳 → 烟花
        for (var i = 0; i < 3; i++) {
          firework(rand(0.2, 0.8), rand(0.15, 0.45), isMobile ? 40 : 70, rand(28, 52));
        }
        bloomPulse = 1;
      }
      if (g === 'victory' && handState.lastGesture !== 'victory') musicToggle();
      if (g === 'fist') {
        firework(rand(0.3, 0.7), rand(0.2, 0.5), isMobile ? 30 : 55, rand(35, 50));
        bloomPulse = 1;
      }
      handState.lastGesture = g;
    }
    handState.gesture = g;
  }
  var guestureActive = false;

  /* =====================================================================
     主循环
     ===================================================================== */
  function onResize() {
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    fit = computeFit();
    TARGET_Y = fit.ty;
    camera.fov = fit.fov;
    if (!userZoomed) { dist = targetDist = fit.dist; }
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(DPR);
    resizeTargets(Math.floor(w * DPR), Math.floor(h * DPR));
    resizeFx();
    [matTree, matGarland, matOrn, matFloor, matSnow, matSpark].forEach(function (m) {
      m.uniforms.uPR.value = DPR;
    });
  }
  window.addEventListener('resize', onResize);
  onResize();

  var clock = new THREE.Clock();
  var tAcc = 0, running = true;

  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running) clock.getDelta();
  });

  function frameCamera(dt) {
    var now = performance.now();
    var handDriving = hands.ready && hands.hasHand && ['open', 'point', 'victory'].indexOf(hands.label) >= 0;
    if (!handDriving) {
      if (!dragging && now > idleAt && !reduceMotion) theta += dt * 0.055;
    }
    dist += (targetDist - dist) * Math.min(1, dt * 3.2);
    var cy = Math.sin(phi) * dist;
    var cr = Math.cos(phi) * dist;
    camera.position.set(Math.sin(theta) * cr, TARGET_Y + cy, Math.cos(theta) * cr);
    camera.lookAt(0, TARGET_Y, 0);
  }

  function animate() {
    requestAnimationFrame(animate);
    if (!running) return;
    var dt = Math.min(clock.getDelta(), 0.05);
    tAcc += dt;

    if (hands.ready) detectHands(performance.now());
    applyHand(dt);

    [matTree, matGarland, matOrn, matFloor, matSnow, matSpark].forEach(function (m) {
      m.uniforms.uTime.value = tAcc;
      m.uniforms.uExplode.value = explode;
    });
    // 树本身受握拳影响最明显
    matTree.uniforms.uExplode.value = explode;
    matGarland.uniforms.uExplode.value = explode;
    matOrn.uniforms.uExplode.value = explode;

    for (var i = 0; i < N_SNOW; i++) {
      var o = i * 3, d = snowData[i];
      var y = snowPos.array[o + 1] - d.vy * dt;
      if (y < -0.5) { y = 32; snowPos.array[o] = rand(-26, 26); snowPos.array[o + 2] = rand(-26, 26); }
      snowPos.array[o + 1] = y;
      snowPos.array[o] += Math.sin(tAcc * d.drift + d.ph) * dt * 0.35;
    }
    snowPos.needsUpdate = true;

    var pulse = 1 + Math.sin(tAcc * 1.7) * 0.06;
    star.scale.set(2.6 * pulse, 2.6 * pulse, 1);
    starHalo.scale.set(8.5 * pulse, 8.5 * pulse, 1);
    starHalo.material.opacity = 0.26 + Math.sin(tAcc * 1.7) * 0.06;
    star.material.opacity = 0.95 - explode * 0.5;
    starHalo.material.opacity *= (1 - explode * 0.6);
    treeGroup.rotation.y = Math.sin(tAcc * 0.12) * 0.04;

    updateSparks(dt);
    updateFx(dt);
    frameCamera(dt);

    for (var j = 0; j < photos.length; j++) {
      var m = photos[j].material;
      if (m.opacity < 1) m.opacity = Math.min(1, m.opacity + dt * 1.6);
    }

    // ---- 渲染：场景 → 泛光 → 合成 ----
    bloomPulse = Math.max(0, bloomPulse - dt * 1.8);

    renderer.setRenderTarget(rtScene);
    renderer.clear();
    renderer.render(scene, camera);

    fsQuad.material = matBright;
    matBright.uniforms.tDiffuse.value = rtScene.texture;
    renderer.setRenderTarget(rtBright);
    renderer.render(fsScene, fsCam);

    fsQuad.material = matBlur;
    matBlur.uniforms.tDiffuse.value = rtBright.texture;
    matBlur.uniforms.uDir.value.set(1 / rtBlurA.width, 0);
    renderer.setRenderTarget(rtBlurA);
    renderer.render(fsScene, fsCam);

    matBlur.uniforms.tDiffuse.value = rtBlurA.texture;
    matBlur.uniforms.uDir.value.set(0, 1 / rtBlurA.height);
    renderer.setRenderTarget(rtBlurB);
    renderer.render(fsScene, fsCam);

    matBlur.uniforms.tDiffuse.value = rtBlurB.texture;
    matBlur.uniforms.uDir.value.set(1.6 / rtBlurA.width, 0);
    renderer.setRenderTarget(rtBlurA);
    renderer.render(fsScene, fsCam);

    matBlur.uniforms.tDiffuse.value = rtBlurA.texture;
    matBlur.uniforms.uDir.value.set(0, 1.6 / rtBlurA.height);
    renderer.setRenderTarget(rtBlurB);
    renderer.render(fsScene, fsCam);

    fsQuad.material = matComp;
    matComp.uniforms.tScene.value = rtScene.texture;
    matComp.uniforms.tBloom.value = rtBlurB.texture;
    matComp.uniforms.uStrength.value = 0.62 + bloomPulse * 0.75 + explode * 0.30;
    renderer.setRenderTarget(null);
    renderer.render(fsScene, fsCam);
  }

  try {
    renderer.render(scene, camera);
    document.body.classList.add('ready');
  } catch (e) {
    fail('渲染失败：' + (e && e.message ? e.message : e));
    return;
  }
  animate();

  setTimeout(function () {
    burst(0, H * 0.62, 0, isMobile ? 40 : 70, 0.12);
  }, 900);

  /* ---------------- 调试钩子（自动化测试用）---------------- */
  window.__tree = {
    simHand: function (gesture, x, y) {
      hands.ready = true;
      hands.hasHand = gesture !== 'none';
      hands.label = gesture;
      handState.gesture = gesture;
      hands.palm.x = x == null ? 0.5 : x;
      hands.palm.y = y == null ? 0.5 : y;
      hands.pinchNow = gesture === 'pinch' ? 0.2 : 1;
      handState.lastGesture = gesture;
      return gesture;
    },
    explode: function (v) { explode = v; explodeTarget = v; },
    fx: function (x, y, n, hue) { firework(x, y, n || 120, hue == null ? 42 : hue); bloomPulse = 1; },
    state: function () { return { explode: explode, gesture: handState.gesture, theta: theta, dist: dist }; }
  };
})();
</script>
</body>
</html>
