<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03060d">
<title>Merry Christmas · 圣诞树</title>
<meta name="description" content="一棵会呼吸的 3D 粒子圣诞树：拖动旋转、点击撒星火、可以挂上自己的照片。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<style>
  :root{
    --gold:#ffd9a0;
    --gold-2:#ffe9c9;
    --ink:#eaf2ff;
    --glass:rgba(255,255,255,.07);
    --glass-brd:rgba(255,255,255,.16);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","Noto Serif SC",serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; background:#03060d; color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  /* 夜空底色（canvas 是透明的，这里负责氛围） */
  body::before{
    content:""; position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(120% 90% at 50% 108%, rgba(38,86,130,.55) 0%, rgba(14,32,56,.35) 38%, rgba(0,0,0,0) 68%),
      radial-gradient(70% 55% at 50% 16%, rgba(30,52,96,.42) 0%, rgba(0,0,0,0) 70%),
      linear-gradient(180deg,#04070f 0%, #050b16 42%, #02040a 100%);
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(58% 52% at 50% 52%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%);
  }
  #stage{position:fixed; inset:0; z-index:2}
  #stage canvas{display:block; width:100%; height:100%; opacity:0; transition:opacity 1.1s ease .15s}
  body.ready #stage canvas{opacity:1}

  /* ---------- 文案 ---------- */
  .hud{position:fixed; z-index:5; pointer-events:none; opacity:0; transform:translateY(10px);
       transition:opacity .9s ease, transform .9s ease}
  body.ready .hud{opacity:1; transform:none}
  .top{left:0; right:0; top:clamp(20px,5vh,56px); text-align:center; padding:0 20px}
  .title{
    margin:0; font-family:var(--serif); font-weight:500;
    font-size:clamp(21px,6vw,54px); letter-spacing:.1em; text-transform:uppercase;
    background:linear-gradient(180deg,#fffdf8 0%,var(--gold-2) 38%,#f0b96b 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,196,110,.35));
  }
  .sub{
    margin:.55em 0 0; font-size:clamp(12px,1.5vw,15px); letter-spacing:.22em;
    color:rgba(226,238,255,.62); font-weight:300;
  }
  .bottom{left:0; right:0; bottom:max(26px,env(safe-area-inset-bottom)); text-align:center; padding:0 16px}
  .hint{font-size:12px; letter-spacing:.14em; color:rgba(210,226,248,.42)}

  .corner{position:fixed; z-index:5; font-size:11px; letter-spacing:.18em; color:rgba(200,218,244,.34);
          pointer-events:none; opacity:0; transition:opacity 1.2s ease .4s}
  body.ready .corner{opacity:1}
  .corner.bl{left:18px; bottom:14px}
  .corner.br{right:18px; bottom:14px}

  /* ---------- 按钮 ---------- */
  .dock{
    position:fixed; z-index:6; left:0; right:0; bottom:calc(max(26px,env(safe-area-inset-bottom)) + 34px);
    transform:translateY(14px); display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    opacity:0; transition:opacity .8s ease .25s, transform .8s ease .25s; padding:0 12px;
  }
  body.ready .dock{opacity:1; transform:none}
  .btn{
    pointer-events:auto; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    padding:9px 15px; border-radius:999px; border:1px solid var(--glass-brd);
    background:var(--glass); color:rgba(235,244,255,.86); font-size:13px; letter-spacing:.06em;
    backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
    transition:background .25s, border-color .25s, transform .18s, color .25s;
    font-family:inherit;
  }
  .btn:hover{background:rgba(255,255,255,.14); border-color:rgba(255,214,158,.45); color:#fff}
  .btn:active{transform:scale(.96)}
  .btn.on{border-color:rgba(255,206,140,.7); color:#ffdfb0; background:rgba(255,190,110,.14)}
  .btn svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.6;
           stroke-linecap:round; stroke-linejoin:round; opacity:.9}

  /* ---------- 提示 / 报错 ---------- */
  .toast{
    position:fixed; z-index:9; left:50%; bottom:calc(max(26px,env(safe-area-inset-bottom)) + 92px);
    transform:translate(-50%,8px); padding:10px 18px; border-radius:999px;
    background:rgba(8,14,24,.82); border:1px solid var(--glass-brd); color:var(--gold-2);
    font-size:13px; letter-spacing:.08em; opacity:0; pointer-events:none;
    transition:opacity .3s, transform .3s; backdrop-filter:blur(10px);
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}
  #fatal{
    position:fixed; inset:0; z-index:20; display:none; place-items:center; text-align:center;
    background:#03060d; color:#cfe0f5; padding:30px; line-height:1.9; font-size:14px;
  }
  #fatal.show{display:grid}
  #fatal code{color:var(--gold); font-size:12px}

  @media (max-width:560px){
    .dock{gap:6px; bottom:calc(max(14px,env(safe-area-inset-bottom)) + 72px); padding:0 8px}
    .btn{padding:9px 11px; font-size:12px}
    .btn .lbl{display:none}
    .bottom{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 30px)}
    .hint{font-size:11px; letter-spacing:.1em}
    .corner{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    #stage canvas{transition:none}
  }
</style>
</head>
<body>

<div id="stage" aria-hidden="true"></div>

<div class="hud top">
  <h1 class="title" id="title">Merry Christmas</h1>
  <p class="sub" id="sub">愿这棵树替我陪你过冬</p>
</div>

<div class="dock">
  <button class="btn" id="btnMusic" type="button" title="播放 / 暂停铃儿响叮当">
    <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.6"/><circle cx="16.5" cy="16" r="2.6"/></svg>
    <span class="lbl">音乐</span>
  </button>
  <button class="btn" id="btnPhotos" type="button" title="把你的照片挂到树上">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l4.5-4.2L13 17l3-2.6 4 3.6"/></svg>
    <span class="lbl">挂照片</span>
  </button>
  <button class="btn" id="btnName" type="button" title="写上你想对 TA 说的话里的名字">
    <svg viewBox="0 0 24 24"><path d="M4 20h4l10-10a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5 4 20z"/></svg>
    <span class="lbl">名字</span>
  </button>
  <button class="btn" id="btnShare" type="button" title="复制带名字的链接">
    <svg viewBox="0 0 24 24"><path d="M10 13a4.5 4.5 0 0 0 6.4 0l2.6-2.6a4.5 4.5 0 0 0-6.4-6.4L11 5.6"/><path d="M14 11a4.5 4.5 0 0 0-6.4 0L5 13.6a4.5 4.5 0 0 0 6.4 6.4l1.6-1.6"/></svg>
    <span class="lbl">复制链接</span>
  </button>
  <button class="btn wide" id="btnFull" type="button" title="全屏">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <span class="lbl">全屏</span>
  </button>
</div>

<div class="hud bottom">
  <p class="hint" id="hint">拖动旋转 · 滚轮缩放 · 点击撒一把星火</p>
</div>

<div class="corner bl">christmas-tree · v7.6</div>
<div class="corner br" id="credit">three.js · webgl</div>

<div class="toast" id="toast"></div>
<input type="file" id="filePicker" accept="image/*" multiple hidden>

<div id="fatal">
  <div>
    <p style="font-size:20px;letter-spacing:.2em;color:#ffd9a0;margin:0 0 12px">3D 场景没能启动</p>
    <p id="fatalMsg">需要浏览器支持 WebGL。<br>试试用 Chrome / Edge 打开，或开启硬件加速。</p>
    <p><code>chrome://settings/system</code> → 使用图形加速功能</p>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var TAU = Math.PI * 2;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
                 (navigator.maxTouchPoints > 1 && window.innerWidth < 820);

  function fail(msg) {
    $('fatalMsg').innerHTML = msg;
    $('fatal').classList.add('show');
  }
  if (typeof THREE === 'undefined') {
    fail('没有找到 <code>vendor/three.min.js</code>。<br>请把整个文件夹一起上传，不要只传 index.html。');
    return;
  }

  var toastTimer = null;
  function toast(text) {
    var el = $('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  /* =======================================================================
     参数
     ======================================================================= */
  var H = 15;                       // 树高
  var R = 6.2;                      // 底部半径
  var TURNS = 9;                    // 螺旋圈数
  var TARGET_Y = H * 0.57;
  var fit = { fov: 45, dist: 33, ty: H * 0.57 };

  var N_SHELL   = isMobile ? 10000 : 20000;
  var N_GARLAND = isMobile ? 2600  : 5200;
  var N_ORN     = isMobile ? 200   : 360;
  var N_FLOOR   = isMobile ? 800   : 1500;
  var N_SNOW    = isMobile ? 900   : 1800;

  function coneRadius(y) {
    var t = Math.min(Math.max(y / H, 0), 1);
    return R * Math.pow(1 - t, 0.86);
  }

  /* =======================================================================
     渲染器 / 场景
     ======================================================================= */
  var stage = $('stage');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: !isMobile, alpha: true, powerPreference: 'high-performance' });
  } catch (e) {
    fail('这个浏览器没能创建 WebGL 上下文。<br>请用较新的 Chrome / Edge / Safari 打开。');
    return;
  }
  var DPR = Math.min(window.devicePixelRatio || 1, isMobile ? 2 : 2);
  renderer.setPixelRatio(DPR);
  renderer.setSize(window.innerWidth, window.innerHeight);
  if ('outputEncoding' in renderer) renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0x000000, 0);
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 400);

  /* =======================================================================
     材质工厂：一枚会呼吸的圆形粒子
     ======================================================================= */
  var POINT_VERT = [
    'uniform float uTime;',
    'uniform float uPR;',
    'uniform float uScale;',
    'uniform float uSway;',
    'uniform float uTwinkle;',
    'uniform float uAlpha;',
    'attribute float aSize;',
    'attribute float aPhase;',
    'attribute float aAlpha;',
    'attribute vec3 aColor;',
    'varying vec3 vColor;',
    'varying float vA;',
    'void main() {',
    '  vec3 p = position;',
    '  float h = max(p.y, 0.0) / ' + H.toFixed(1) + ';',
    '  float s = sin(uTime * 0.75 + h * 3.0 + aPhase * 6.2831);',
    '  p.x += s * uSway * (0.25 + h * 1.1);',
    '  p.z += cos(uTime * 0.62 + h * 2.4 + aPhase * 6.2831) * uSway * (0.25 + h * 1.1);',
    '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
    '  gl_Position = projectionMatrix * mv;',
    '  float tw = mix(1.0, 0.5 + 0.5 * sin(uTime * 2.6 + aPhase * 21.0), uTwinkle);',
    '  float ps = aSize * uScale * uPR * (66.0 / max(-mv.z, 0.001)) * (0.8 + 0.4 * tw);',
    '  gl_PointSize = clamp(ps, 1.0, 26.0);',
    '  vColor = aColor;',
    '  vA = uAlpha * (0.40 + 0.32 * tw) * aAlpha;',
    '}'
  ].join('\n');

  var POINT_FRAG = [
    'varying vec3 vColor;',
    'varying float vA;',
    'uniform float uSoft;',
    'void main() {',
    '  vec2 uv = gl_PointCoord - 0.5;',
    '  float d = length(uv) * 2.0;',
    '  if (d > 1.0) discard;',
    '  float a = smoothstep(1.0, 0.0, d);',
    '  a = pow(a, uSoft);',
    '  gl_FragColor = vec4(vColor * (0.55 + 0.75 * a), a * vA);',
    '}'
  ].join('\n');

  function makeMaterial(opts) {
    return new THREE.ShaderMaterial({
      uniforms: {
        uTime:    { value: 0 },
        uPR:      { value: DPR },
        uScale:   { value: opts.scale || 1 },
        uSway:    { value: opts.sway || 0 },
        uTwinkle: { value: opts.twinkle != null ? opts.twinkle : 0.6 },
        uAlpha:   { value: opts.alpha != null ? opts.alpha : 1 },
        uSoft:    { value: opts.soft != null ? opts.soft : 2.2 }
      },
      vertexShader: POINT_VERT,
      fragmentShader: POINT_FRAG,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending: THREE.AdditiveBlending
    });
  }

  function buildPoints(count, fill, material) {
    var pos = new Float32Array(count * 3);
    var col = new Float32Array(count * 3);
    var size = new Float32Array(count);
    var phase = new Float32Array(count);
    var alpha = new Float32Array(count);
    var c = new THREE.Color();
    var i, o;
    for (i = 0; i < count; i++) {
      o = i * 3;
      fill(i, pos, o, c, size, i, phase, alpha);
      col[o] = c.r; col[o + 1] = c.g; col[o + 2] = c.b;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
    g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    g.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
    g.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1));
    var p = new THREE.Points(g, material);
    p.frustumCulled = false;
    return p;
  }

  /* =======================================================================
     树：外壳 + 螺旋彩带 + 挂饰
     ======================================================================= */
  var matTree = makeMaterial({ scale: 1.0, sway: 0.22, twinkle: 0.55, soft: 2.0, alpha: 0.95 });
  var matGarland = makeMaterial({ scale: 1.25, sway: 0.26, twinkle: 0.8, soft: 1.7, alpha: 1.0 });
  var matOrn = makeMaterial({ scale: 0.95, sway: 0.2, twinkle: 0.35, soft: 1.5, alpha: 1.0 });

  var treeGroup = new THREE.Group();
  scene.add(treeGroup);

  function rand(a, b) { return a + Math.random() * (b - a); }

  // 1) 外壳：锥面上的绿色粒子
  treeGroup.add(buildPoints(N_SHELL, function (i, pos, o, c, size, idx, phase, alpha) {
    var y = H * Math.pow(Math.random(), 1.16);
    var r = coneRadius(y) * rand(0.80, 1.0);
    var a = Math.random() * TAU;
    pos[o] = Math.cos(a) * r;
    pos[o + 1] = y + rand(-0.12, 0.12);
    pos[o + 2] = Math.sin(a) * r;
    var t = y / H;
    c.setHSL(rand(0.30, 0.38) - t * 0.05, rand(0.55, 0.95), rand(0.12, 0.30) + t * 0.13);
    size[idx] = rand(0.7, 1.7);
    phase[idx] = Math.random();
    alpha[idx] = 1;
  }, matTree));

  // 2) 螺旋彩带：一圈圈盘上去的亮点，让树有结构
  (function garland() {
    var strands = 6;
    var per = Math.floor(N_GARLAND / strands);
    var idx = 0;
    treeGroup.add(buildPoints(per * strands, function (i, pos, o, c, size, k, phase, alpha) {
      var s = Math.floor(i / per);
      var t = (i % per) / per;
      var y = t * H * 0.985;
      var a = (t * TURNS + s / strands) * TAU;
      var r = coneRadius(y) * 1.015;
      pos[o] = Math.cos(a) * r;
      pos[o + 1] = y;
      pos[o + 2] = Math.sin(a) * r;
      var warm = Math.pow(t, 3);
      c.setHSL(0.12 - warm * 0.01, 0.92, 0.50 + warm * 0.16);
      size[k] = rand(1.3, 2.5);
      phase[k] = Math.random();
      alpha[k] = 1;
      idx++;
    }, matGarland));
  })();

  // 3) 挂饰：金、红、冰蓝的球
  treeGroup.add(buildPoints(N_ORN, function (i, pos, o, c, size, k, phase, alpha) {
    var y = rand(0.2, H * 0.96);
    var a = Math.random() * TAU;
    var r = coneRadius(y) * 1.035;
    pos[o] = Math.cos(a) * r;
    pos[o + 1] = y;
    pos[o + 2] = Math.sin(a) * r;
    var pick = Math.random();
    if (pick < 0.5)      c.setHSL(0.105, 0.92, 0.62);        // 金
    else if (pick < 0.78) c.setHSL(0.995, 0.88, 0.55);       // 红
    else                  c.setHSL(0.55, 0.42, 0.86);        // 冰
    size[k] = rand(2.2, 4.0);
    phase[k] = Math.random();
    alpha[k] = 1;
  }, matOrn));

  // 4) 地面：落在雪地上的碎灯
  var matFloor = makeMaterial({ scale: 0.8, sway: 0, twinkle: 0.9, soft: 2.4, alpha: 0.9 });
  scene.add(buildPoints(N_FLOOR, function (i, pos, o, c, size, k, phase, alpha) {
    var a = Math.random() * TAU;
    var r = rand(2.0, 12.5);
    pos[o] = Math.cos(a) * r;
    pos[o + 1] = -0.15 + rand(-0.05, 0.05);
    pos[o + 2] = Math.sin(a) * r;
    var fade = 1 - Math.min(r / 12.5, 1);
    c.setHSL(rand(0.07, 0.14), 0.8, 0.20 + fade * 0.18);
    size[k] = rand(0.4, 1.2) * (0.35 + fade * 0.9);
    phase[k] = Math.random();
    alpha[k] = rand(0.15, 0.55) * fade;
  }, matFloor));

  /* =======================================================================
     地面光晕 + 顶星
     ======================================================================= */
  function radialTexture(stops, size) {
    size = size || 256;
    var cv = document.createElement('canvas');
    cv.width = cv.height = size;
    var ctx = cv.getContext('2d');
    var g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    stops.forEach(function (s) { g.addColorStop(s[0], s[1]); });
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    var tex = new THREE.CanvasTexture(cv);
    if ('encoding' in tex) tex.encoding = THREE.sRGBEncoding;
    tex.needsUpdate = true;
    return tex;
  }

  var glowTex = radialTexture([
    [0, 'rgba(255,214,160,0.85)'],
    [0.35, 'rgba(255,168,90,0.30)'],
    [1, 'rgba(255,140,60,0)']
  ]);

  var pool = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.28 })
  );
  pool.rotation.x = -Math.PI / 2;
  pool.position.y = -0.2;
  scene.add(pool);

  // 顶星：一枚柔光 + 一枚十字星芒
  function starTexture() {
    var s = 512, cv = document.createElement('canvas');
    cv.width = cv.height = s;
    var ctx = cv.getContext('2d');
    var cx = s / 2;
    var g = ctx.createRadialGradient(cx, cx, 0, cx, cx, s * 0.5);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.12, 'rgba(255,244,214,0.95)');
    g.addColorStop(0.3, 'rgba(255,206,130,0.35)');
    g.addColorStop(1, 'rgba(255,180,90,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
    // 星芒
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(cx, cx);
    for (var k = 0; k < 4; k++) {
      ctx.rotate(Math.PI / 2);
      var lg = ctx.createLinearGradient(0, 0, 0, -s * 0.48);
      lg.addColorStop(0, 'rgba(255,250,235,0.9)');
      lg.addColorStop(1, 'rgba(255,220,160,0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(-s * 0.012, 0);
      ctx.lineTo(0, -s * 0.48);
      ctx.lineTo(s * 0.012, 0);
      ctx.closePath();
      ctx.fill();
    }
    var tex = new THREE.CanvasTexture(cv);
    if ('encoding' in tex) tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  var star = new THREE.Sprite(new THREE.SpriteMaterial({
    map: starTexture(), transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, opacity: 0.95
  }));
  star.scale.set(2.6, 2.6, 1);
  star.position.set(0, H + 0.55, 0);
  scene.add(star);

  var starHalo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, opacity: 0.30
  }));
  starHalo.scale.set(8.5, 8.5, 1);
  starHalo.position.copy(star.position);
  scene.add(starHalo);

  /* =======================================================================
     雪
     ======================================================================= */
  var snowData = [];
  var matSnow = makeMaterial({ scale: 1.0, sway: 0, twinkle: 0.5, soft: 2.4, alpha: 0.95 });
  var snow = buildPoints(N_SNOW, function (i, pos, o, c, size, k, phase, alpha) {
    var x = rand(-26, 26), y = rand(0, 32), z = rand(-26, 26);
    pos[o] = x; pos[o + 1] = y; pos[o + 2] = z;
    c.setHSL(0.56, rand(0.05, 0.3), rand(0.72, 0.96));
    size[k] = rand(0.5, 1.35);
    phase[k] = Math.random();
    alpha[k] = rand(0.30, 0.85);
    snowData.push({ vy: rand(0.35, 1.15), drift: rand(0.25, 0.9), ph: Math.random() * TAU });
  }, matSnow);
  scene.add(snow);
  var snowPos = snow.geometry.attributes.position;

  /* =======================================================================
     星火（点击迸发）
     ======================================================================= */
  var MAX_SPARK = 420;
  var sparkGeo = new THREE.BufferGeometry();
  var sparkPos = new Float32Array(MAX_SPARK * 3);
  var sparkCol = new Float32Array(MAX_SPARK * 3);
  var sparkSize = new Float32Array(MAX_SPARK);
  var sparkPhase = new Float32Array(MAX_SPARK);
  var sparkAlpha = new Float32Array(MAX_SPARK);
  var sparkVel = new Float32Array(MAX_SPARK * 3);
  var sparkLife = new Float32Array(MAX_SPARK);
  sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
  sparkGeo.setAttribute('aColor', new THREE.BufferAttribute(sparkCol, 3));
  sparkGeo.setAttribute('aSize', new THREE.BufferAttribute(sparkSize, 1));
  sparkGeo.setAttribute('aPhase', new THREE.BufferAttribute(sparkPhase, 1));
  sparkGeo.setAttribute('aAlpha', new THREE.BufferAttribute(sparkAlpha, 1));
  var matSpark = makeMaterial({ scale: 1.0, sway: 0, twinkle: 0.75, soft: 2.0 });
  var sparks = new THREE.Points(sparkGeo, matSpark);
  sparks.frustumCulled = false;
  scene.add(sparks);
  var sparkCursor = 0;
  var tmpColor = new THREE.Color();

  function burst(x, y, z, n, hue) {
    for (var i = 0; i < n; i++) {
      var k = sparkCursor % MAX_SPARK;
      sparkCursor++;
      var o = k * 3;
      sparkPos[o] = x; sparkPos[o + 1] = y; sparkPos[o + 2] = z;
      var th = Math.random() * TAU, ph = Math.acos(rand(-1, 1)), sp = rand(1.2, 6.2);
      sparkVel[o] = Math.sin(ph) * Math.cos(th) * sp;
      sparkVel[o + 1] = Math.cos(ph) * sp * 0.85 + 1.1;
      sparkVel[o + 2] = Math.sin(ph) * Math.sin(th) * sp;
      tmpColor.setHSL(hue + rand(-0.05, 0.05), rand(0.5, 0.95), rand(0.6, 0.85));
      sparkCol[o] = tmpColor.r; sparkCol[o + 1] = tmpColor.g; sparkCol[o + 2] = tmpColor.b;
      sparkSize[k] = rand(1.0, 2.6);
      sparkPhase[k] = Math.random();
      sparkAlpha[k] = 1;
      sparkLife[k] = rand(0.9, 1.9);
    }
    sparkGeo.attributes.position.needsUpdate = true;
    sparkGeo.attributes.aColor.needsUpdate = true;
    sparkGeo.attributes.aSize.needsUpdate = true;
    sparkGeo.attributes.aAlpha.needsUpdate = true;
    sparkGeo.attributes.aPhase.needsUpdate = true;
  }

  function updateSparks(dt) {
    var any = false;
    for (var k = 0; k < MAX_SPARK; k++) {
      if (sparkLife[k] <= 0) continue;
      any = true;
      var o = k * 3;
      sparkLife[k] -= dt;
      sparkVel[o + 1] -= 4.2 * dt;
      sparkVel[o] *= (1 - 0.9 * dt);
      sparkVel[o + 2] *= (1 - 0.9 * dt);
      sparkPos[o] += sparkVel[o] * dt;
      sparkPos[o + 1] += sparkVel[o + 1] * dt;
      sparkPos[o + 2] += sparkVel[o + 2] * dt;
      if (sparkPos[o + 1] < -0.1) { sparkPos[o + 1] = -0.1; sparkVel[o + 1] *= -0.25; }
      var l = Math.max(sparkLife[k], 0);
      sparkAlpha[k] = Math.min(1, l * 1.4);
      if (sparkLife[k] <= 0) sparkAlpha[k] = 0;
    }
    if (any) {
      sparkGeo.attributes.position.needsUpdate = true;
      sparkGeo.attributes.aAlpha.needsUpdate = true;
    }
  }

  /* =======================================================================
     相机：拖动 / 惯性 / 缩放
     ======================================================================= */
  var theta = 0.35, phi = 0.13, dist = 33, targetDist = 33;
  var dTheta = 0, dPhi = 0;
  var dragging = false, lastX = 0, lastY = 0, idleAt = 0, pinchStart = 0, pinchDist = 0;

  var el = renderer.domElement;

  function onDown(e) {
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    dTheta = dPhi = 0;
    el.style.cursor = 'grabbing';
    idleAt = performance.now() + 2600;
  }
  function onMove(e) {
    if (!dragging) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    dTheta = -dx * 0.0055;
    dPhi = -dy * 0.0035;
    theta += dTheta;
    phi = Math.min(Math.max(phi + dPhi, -0.22), 0.78);
    idleAt = performance.now() + 2600;
  }
  function onUp(e) {
    dragging = false;
    el.style.cursor = 'grab';
    idleAt = performance.now() + 1600;
    if (e && Math.abs(e.clientX - lastX) < 3 && Math.abs(e.clientY - lastY) < 3) { /* 交给 click */ }
  }

  el.style.cursor = 'grab';
  el.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove, { passive: true });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  el.addEventListener('wheel', function (e) {
    e.preventDefault();
    userZoomed = true;
    targetDist = Math.min(Math.max(targetDist + e.deltaY * 0.022, 16), 62);
    idleAt = performance.now() + 2400;
  }, { passive: false });

  // 双指缩放
  el.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
      pinchStart = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      pinchDist = targetDist;
    }
  }, { passive: true });
  el.addEventListener('touchmove', function (e) {
    if (e.touches.length === 2 && pinchStart > 0) {
      var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      userZoomed = true;
      targetDist = Math.min(Math.max(pinchDist * (pinchStart / Math.max(d, 1)), 16), 62);
      e.preventDefault();
    }
  }, { passive: false });

  // 点击撒星火
  var raycaster = new THREE.Raycaster();
  var pointerNDC = new THREE.Vector2();
  el.addEventListener('click', function (e) {
    pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointerNDC, camera);
    var p = new THREE.Vector3();
    raycaster.ray.at(raycaster.ray.direction.y > 0.15 ? 26 : 30, p);
    p.y = Math.min(Math.max(p.y, 0.5), H + 2);
    p.x = Math.min(Math.max(p.x, -9), 9);
    p.z = Math.min(Math.max(p.z, -9), 9);
    burst(p.x, p.y, p.z, isMobile ? 60 : 110, rand(0.06, 0.16));
  });

  function frameCamera(dt) {
    var now = performance.now();
    if (!dragging && now > idleAt && !reduceMotion) theta += dt * 0.055;
    if (!dragging) { dTheta *= 0.92; dPhi *= 0.92; }
    dist += (targetDist - dist) * Math.min(1, dt * 3.2);
    var cy = Math.sin(phi) * dist;
    var cr = Math.cos(phi) * dist;
    camera.position.set(Math.sin(theta) * cr, TARGET_Y + cy, Math.cos(theta) * cr);
    camera.lookAt(0, TARGET_Y, 0);
  }

  /* =======================================================================
     照片挂饰
     ======================================================================= */
  var photos = [];
  var photoTextures = [];
  var filePicker = $('filePicker');

  function polaroid(img) {
    var W = 420, Hc = 500;
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = Hc;
    var ctx = cv.getContext('2d');
    // 白边
    ctx.fillStyle = '#fbf8f3';
    ctx.beginPath();
    var r = 14;
    ctx.moveTo(r, 0); ctx.arcTo(W, 0, W, Hc, r); ctx.arcTo(W, Hc, 0, Hc, r);
    ctx.arcTo(0, Hc, 0, 0, r); ctx.arcTo(0, 0, W, 0, r); ctx.closePath();
    ctx.fill();
    // 图片区域
    var pad = 22, top = 22, bottom = 78;
    var iw = W - pad * 2, ih = Hc - top - bottom;
    var s = Math.max(iw / img.width, ih / img.height);
    var dw = img.width * s, dh = img.height * s;
    ctx.save();
    ctx.beginPath();
    ctx.rect(pad, top, iw, ih);
    ctx.clip();
    ctx.drawImage(img, pad + (iw - dw) / 2, top + (ih - dh) / 2, dw, dh);
    ctx.restore();
    // 底部小字
    ctx.fillStyle = 'rgba(60,70,86,.55)';
    ctx.font = '300 22px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Merry Christmas', W / 2, Hc - 32);
    var tex = new THREE.CanvasTexture(cv);
    if ('encoding' in tex) tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    tex.needsUpdate = true;
    return tex;
  }

  function addPhoto(img) {
    var tex = polaroid(img);
    var mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0 });
    var sp = new THREE.Sprite(mat);
    var y = rand(1.6, H * 0.9);
    var a = rand(0, TAU);
    var rr = coneRadius(y) * 1.06 + 0.55;
    sp.position.set(Math.cos(a) * rr, y, Math.sin(a) * rr);
    var sc = 1.5 + (y / H) * 0.5;
    sp.scale.set(sc, sc * (500 / 420), 1);
    sp.material.rotation = rand(-0.14, 0.14);
    treeGroup.add(sp);
    photos.push(sp);
    photoTextures.push(tex);
  }

  filePicker.addEventListener('change', function () {
    var files = Array.prototype.slice.call(filePicker.files || []);
    if (!files.length) return;
    var room = 14 - photos.length;
    files = files.slice(0, Math.max(room, 0));
    if (!files.length) { toast('树上最多挂 14 张，先刷新再来'); return; }
    var done = 0;
    files.forEach(function (f) {
      var url = URL.createObjectURL(f);
      var img = new Image();
      img.onload = function () {
        addPhoto(img);
        URL.revokeObjectURL(url);
        if (++done === files.length) toast('挂上去了 · 转一圈看看');
      };
      img.onerror = function () { URL.revokeObjectURL(url); toast('这张图片读不出来'); };
      img.src = url;
    });
    filePicker.value = '';
  });

  $('btnPhotos').addEventListener('click', function () { filePicker.click(); });

  /* =======================================================================
     音乐：WebAudio 合成《Jingle Bells》
     ======================================================================= */
  var actx = null, master = null, musicOn = false, musicTimer = null, nextLoopAt = 0;

  var BEAT = 0.34;
  var E4 = 329.63, F4 = 349.23, G4 = 392.00, C4 = 261.63, D4 = 293.66, A4 = 440.00;
  var MELODY = [
    [E4, 1], [E4, 1], [E4, 2],
    [E4, 1], [E4, 1], [E4, 2],
    [E4, 1], [G4, 1], [C4, 1.5], [D4, 0.5], [E4, 4],
    [F4, 1], [F4, 1], [F4, 1.5], [F4, 0.5],
    [F4, 1], [E4, 1], [E4, 1], [E4, 0.5], [E4, 0.5],
    [E4, 1], [D4, 1], [D4, 1], [E4, 1],
    [D4, 2], [G4, 2],
    [E4, 1], [E4, 1], [E4, 2],
    [E4, 1], [E4, 1], [E4, 2],
    [E4, 1], [G4, 1], [C4, 1.5], [D4, 0.5], [E4, 4],
    [F4, 1], [F4, 1], [F4, 1.5], [F4, 0.5],
    [F4, 1], [E4, 1], [E4, 1], [E4, 0.5], [E4, 0.5],
    [G4, 1], [G4, 1], [F4, 1], [D4, 1],
    [C4, 4]
  ];

  function ensureAudio() {
    if (actx) return actx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.0;
    // 一点点空间感
    var delay = actx.createDelay();
    delay.delayTime.value = 0.19;
    var fb = actx.createGain();
    fb.gain.value = 0.26;
    var wet = actx.createGain();
    wet.gain.value = 0.3;
    master.connect(actx.destination);
    master.connect(delay);
    delay.connect(fb);
    fb.connect(delay);
    delay.connect(wet);
    wet.connect(actx.destination);
    return actx;
  }

  function bell(t, freq, dur) {
    var g = actx.createGain();
    g.connect(master);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.20, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, 0.32) * 1.5);

    var partials = [[1, 1], [2.01, 0.34], [3.02, 0.12], [4.98, 0.05]];
    partials.forEach(function (p) {
      var o = actx.createOscillator();
      var og = actx.createGain();
      o.type = 'sine';
      o.frequency.value = freq * p[0];
      og.gain.value = p[1];
      o.connect(og); og.connect(g);
      o.start(t);
      o.stop(t + Math.max(dur, 0.32) * 1.6 + 0.05);
    });
  }

  function scheduleLoop(startAt) {
    var t = startAt;
    for (var i = 0; i < MELODY.length; i++) {
      var f = MELODY[i][0], b = MELODY[i][1];
      bell(t, f, b * BEAT * 0.9);
      t += b * BEAT;
    }
    return t + 0.6;
  }

  function pump() {
    if (!musicOn) return;
    var now = actx.currentTime;
    while (nextLoopAt < now + 1.2) {
      nextLoopAt = scheduleLoop(nextLoopAt);
    }
    musicTimer = setTimeout(pump, 400);
  }

  function musicToggle() {
    var btn = $('btnMusic');
    if (!ensureAudio()) { toast('这个浏览器不支持 Web Audio'); return; }
    if (actx.state === 'suspended') actx.resume();
    musicOn = !musicOn;
    if (musicOn) {
      nextLoopAt = actx.currentTime + 0.15;
      master.gain.cancelScheduledValues(actx.currentTime);
      master.gain.setTargetAtTime(0.55, actx.currentTime, 0.4);
      pump();
      btn.classList.add('on');
      $('btnMusic').querySelector('.lbl').textContent = '静音';
      toast('🎵 Jingle Bells');
    } else {
      master.gain.setTargetAtTime(0.0, actx.currentTime, 0.25);
      clearTimeout(musicTimer);
      btn.classList.remove('on');
      $('btnMusic').querySelector('.lbl').textContent = '音乐';
    }
  }
  $('btnMusic').addEventListener('click', musicToggle);

  /* =======================================================================
     文案 / 名字 / 分享
     ======================================================================= */
  var qs = new URLSearchParams(location.search);
  var name = (qs.get('to') || qs.get('name') || '').trim().slice(0, 20);

  function renderName() {
    if (name) {
      $('sub').textContent = '亲爱的 ' + name + '，愿这棵树替我陪你过冬';
      document.title = name + ' · Merry Christmas';
    } else {
      $('sub').textContent = '愿这棵树替我陪你过冬';
      document.title = 'Merry Christmas · 圣诞树';
    }
  }
  renderName();

  $('btnName').addEventListener('click', function () {
    var v = window.prompt('想在树上写给谁？（留空就取消）', name || '');
    if (v === null) return;
    name = v.trim().slice(0, 20);
    renderName();
    toast(name ? '写给 ' + name + ' 的树' : '已清空名字');
  });

  $('btnShare').addEventListener('click', function () {
    var url = location.origin + location.pathname + (name ? '?to=' + encodeURIComponent(name) : '');
    if (location.protocol === 'file:') {
      toast('本地文件模式：先部署到网上才有链接');
      return;
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('链接已复制'); }
      catch (err) { toast('复制失败，手动复制地址栏吧'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { toast('链接已复制'); }, fallback);
    } else fallback();
  });

  $('btnFull').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  });

  /* =======================================================================
     主循环
     ======================================================================= */
  function computeFit() {
    var a = window.innerWidth / window.innerHeight;
    if (a < 0.62) return { fov: 52, dist: 41, ty: H * 0.62 };
    if (a < 0.85) return { fov: 52, dist: 38, ty: H * 0.58 };
    if (a < 1.30) return { fov: 48, dist: 38, ty: H * 0.52 };
    return { fov: 45, dist: 39, ty: H * 0.48 };
  }
  var userZoomed = false;

  function onResize() {
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    fit = computeFit();
    TARGET_Y = fit.ty;
    camera.fov = fit.fov;
    if (!userZoomed) { dist = targetDist = fit.dist; }
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(DPR);
    [matTree, matGarland, matOrn, matFloor, matSnow, matSpark].forEach(function (m) {
      m.uniforms.uPR.value = DPR;
    });
  }
  window.addEventListener('resize', onResize);
  onResize();

  var clock = new THREE.Clock();
  var tAcc = 0;
  var running = true;

  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running) clock.getDelta();
  });

  function animate() {
    requestAnimationFrame(animate);
    if (!running) return;
    var dt = Math.min(clock.getDelta(), 0.05);
    tAcc += dt;

    // 树在呼吸
    matTree.uniforms.uTime.value = tAcc;
    matGarland.uniforms.uTime.value = tAcc;
    matOrn.uniforms.uTime.value = tAcc;
    matFloor.uniforms.uTime.value = tAcc;
    matSnow.uniforms.uTime.value = tAcc;
    matSpark.uniforms.uTime.value = tAcc;

    // 雪落
    for (var i = 0; i < N_SNOW; i++) {
      var o = i * 3;
      var d = snowData[i];
      var y = snowPos.array[o + 1] - d.vy * dt;
      if (y < -0.5) {
        y = 32;
        snowPos.array[o] = rand(-26, 26);
        snowPos.array[o + 2] = rand(-26, 26);
      }
      snowPos.array[o + 1] = y;
      snowPos.array[o] += Math.sin(tAcc * d.drift + d.ph) * dt * 0.35;
    }
    snowPos.needsUpdate = true;

    // 星与光晕呼吸
    var pulse = 1 + Math.sin(tAcc * 1.7) * 0.06;
    star.scale.set(2.6 * pulse, 2.6 * pulse, 1);
    starHalo.scale.set(8.5 * pulse, 8.5 * pulse, 1);
    starHalo.material.opacity = 0.26 + Math.sin(tAcc * 1.7) * 0.06;
    treeGroup.rotation.y = Math.sin(tAcc * 0.12) * 0.04;

    updateSparks(dt);
    frameCamera(dt);

    // 照片淡入
    for (var j = 0; j < photos.length; j++) {
      var m = photos[j].material;
      if (m.opacity < 1) m.opacity = Math.min(1, m.opacity + dt * 1.6);
    }

    renderer.render(scene, camera);
  }

  // 第一帧确认没问题再显示，避免白闪
  try {
    renderer.render(scene, camera);
    document.body.classList.add('ready');
  } catch (e) {
    fail('渲染失败：' + (e && e.message ? e.message : e));
    return;
  }
  animate();

  // 开场就来一小把星火
  setTimeout(function () {
    burst(0, H * 0.62, 0, isMobile ? 40 : 70, 0.12);
  }, 900);

  window.__tree = { THREE: THREE, scene: scene, camera: camera };
})();
</script>
</body>
